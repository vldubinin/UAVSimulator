# Тест: проходження маршруту наявним GPS-автопілотом (gps_autopilote/autopilote.py).
# У меню Unreal увімкніть сенсор drone_geo_position.
name: "Маршрут GPS (gps_autopilote)"
objective: "Пройти всі 3 точки маршруту якнайшвидше (щільні розвороти, без зайвих петель; ціль — до 85 с), без зіткнень, з креном не більше 60° і без зриву потоку."
start: auto
mode: AutoTrack
use_truth: false       # алгоритм бачить лише сенсори; truth пишеться для аналізу
control_rate_hz: 20

controller_params:
  # Радіус захоплення 150 м: запас на шум GPS / оцінки курсу; точки при цьому не «зливаються» (між ними ≥1.2 км).
  waypoint_radius_m: 150
  # Маршрут розсунуто: радіус розвороту при ~66 м/с — 370 м (крен 50°) ... 530 м (крен 40°), тож відрізки
  # мають бути ≥ ~2 радіусів, інакше наступна точка опиняється всередині кола розвороту й літак кружляє.
  # Ті самі точка 0, висоти й повороти (-81°, -64°, +34°, +65°), відрізки 1.2 км (було 160-580 м).
  # Кінематична модель логіки autopilote.py: усі 6 точок за ~140 с навіть з фактичним креном 40°.
  waypoints:
    - [50.0463231, 36.2817064, 400.0]
    - [50.0414392, 36.2966690, 490.0]
    - [50.0501361, 36.3065858, 410.0]
  # НАВМИСНЕ ПОГІРШЕННЯ для демонстрації `uavlab improve` (константи autopilote.py підміняються лише на тест):
  #   BANK_STEEP_DEG 50 -> 40: ширші розвороти (радіус ~530 м замість ~370 м), літак проскакує точки й
  #     робить довгі петлі — маршрут займає ~90-115 с замість ~65-75 с (кінематична модель), видно на карті;
  #   ALT_PITCH_GAIN_DEG_PER_M 0.5 -> 0.2: млявий вихід на висоту точок.
  # Нижче ~36° крену літак уже кружляє навколо точки (no_progress) — тому погіршення помірне.
  # Еталонна поведінка — прибрати цей блок.
  autopilote_overrides:
    BANK_STEEP_DEG: 40.0
    ALT_PITCH_GAIN_DEG_PER_M: 0.2
  # Попередній (щільний) маршрут — для довідки:
  #   [50.0463231, 36.2817064, 400.0], [50.04395295027201, 36.288967727181, 490.0],
  #   [50.0455224, 36.2907573, 490.0], [50.0467817, 36.2897081, 490.0],
  #   [50.0492247, 36.2901183, 400.0], [50.05061075454689, 36.29631391551742, 470.0]

stop:
  # Маршрут ~3.6 км (з підльотом): за моделлю справний алгоритм проходить його за ~65-75 с. Набагато довше — він кружляє,
  # і решта польоту лише множить телеметрію (та токени аналізу), не додаючи інформації.
  time_limit_s: 300
  on_crash: true
  progress_key: waypoints_reached  # ctx.log("waypoints_reached", ...) з examples/waypoints_gps.py
  no_progress_s: 90              # точку не взято за 90 с — зупинка "no_progress" (орбітування)

# Формальні критерії для `uavlab improve` (заморожені; шляхи — у metrics.json сесії).
acceptance:
  - {metric: controller_logs.waypoints_reached.max, min: 3}   # усі 3 точки взято
  - {metric: run.collisions, max: 0}
  - {metric: flight.roll_deg.max, max: 60}
  - {metric: flight.roll_deg.min, min: -60}
  - {metric: flight.aoa_deg.max, max: 15}                     # без виходу на зрив
  # Щільні розвороти: еталон (крен 50°) ~65-75 с, погіршений (крен 40°) ~90-115 с — саме цей критерій
  # провалює база v0 і має виправити improve.
  - {metric: run.sim_duration_s, max: 85}

improve:
  max_iterations: 6
  max_cost_usd: 5
  allow: [params, code, autopilot_pid]

record:
  extra_sources:
    - ../../custom_objects_dataset/gps_autopilote/autopilote.py
    - ../../custom_objects_dataset/gps_autopilote/common.py

analysis:
  enabled: true
  language: uk
