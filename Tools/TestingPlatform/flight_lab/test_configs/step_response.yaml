# Діагностика внутрішнього контуру автопілота: ступінчасті уставки крену/тангажу.
name: "Ступінчаста реакція крену й тангажу"
objective: >-
  Внутрішній PID автопілота має відпрацювати ступінь крену ±20° і тангажу +5°/−3° з правильним знаком:
  досягти 90% уставки за ≤2 с, перерегулювання ≤20%, встановлення в межах ±2° за ≤4 с.
  Оцінити передусім налаштування RollPid/PitchPid (дані в маніфесті), а не outer loop — він тут лише генератор ступенів.
start: auto
mode: AutoTrack
use_truth: true
control_rate_hz: 20

controller_params:
  trim_s: 10          # розкрутка двигуна та стабілізація швидкості перед першим ступенем
  segment_s: 6
  roll_step_deg: 20
  pitch_up_deg: 5
  pitch_down_deg: -3
  thrust: 0.6         # 0.7 давала набір ~5 м/с; підберіть так, щоб у фазі trim vertical_speed ≈ 0

stop:
  time_limit_s: 90
  on_crash: true

analysis:
  enabled: true
  language: uk
