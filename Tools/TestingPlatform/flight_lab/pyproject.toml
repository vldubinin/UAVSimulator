[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uavlab"
version = "0.1.0"
description = "Лабораторний стенд віртуальних льотних випробувань UAVSimulator з LLM-аналізом (Claude)"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "anthropic>=0.70",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.8"]

[project.scripts]
uavlab = "uavlab.cli:main"

[tool.setuptools.packages.find]
include = ["uavlab*"]
